<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b6cf0">
  <meta name="description" content="Весёлый тренажёр таблицы умножения для Никиты">
  <title>Умножайка Никиты</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- ===== Меню ===== -->
    <section id="menu" class="screen active">
      <header class="top">
        <h1>Умножайка <span>для Никиты</span></h1>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Звук">🔊</button>
      </header>

      <div class="card level-card">
        <div class="level-row">
          <div class="level-badge" id="levelIcon">🐣</div>
          <div>
            <div class="level-name"><span id="levelNum">1</span>-й уровень: <span id="levelName">Новичок</span></div>
            <div class="level-sub" id="levelSub"></div>
          </div>
        </div>
        <div class="progress"><div id="levelBar"></div></div>
        <div class="stats">
          <div><b id="statStars">0</b><span>⭐ звёзд</span></div>
          <div><b id="statPoints">0</b><span>очков</span></div>
          <div><b id="statBest">0</b><span>⚡ рекорд</span></div>
          <div><b id="statStreak">0</b><span>🔥 серия</span></div>
        </div>
      </div>

      <div class="card">
        <h2>Какие числа учим?</h2>
        <div class="numbers" id="numbers"></div>
        <div class="num-actions">
          <button id="allBtn" class="small-btn" type="button">Выбрать все</button>
        </div>
        <p class="hint" id="numHint"></p>
      </div>

      <div class="modes">
        <button class="mode-btn train" data-mode="train" type="button">
          <span class="mode-icon">🎯</span>
          <span class="mode-title">Тренировка</span>
          <span class="mode-desc">10 примеров, без спешки</span>
        </button>
        <button class="mode-btn speed" data-mode="speed" type="button">
          <span class="mode-icon">⚡</span>
          <span class="mode-title">На скорость</span>
          <span class="mode-desc">60 секунд — сколько успеешь?</span>
        </button>
      </div>
    </section>

    <!-- ===== Игра ===== -->
    <section id="game" class="screen">
      <div class="hud">
        <button id="quitBtn" class="icon-btn" type="button" aria-label="Выйти в меню">✕</button>
        <div class="hud-info" id="hudInfo">1 из 10</div>
        <div class="hud-score">⭐ <span id="hudScore">0</span></div>
      </div>
      <div class="progress game-progress"><div id="gameBar"></div></div>

      <div class="streak" id="streak">&nbsp;</div>
      <div class="question" id="question">2 × 2 = ?</div>
      <div class="feedback" id="feedback">&nbsp;</div>

      <div class="answers" id="answers">
        <button class="answer" type="button"></button>
        <button class="answer" type="button"></button>
        <button class="answer" type="button"></button>
        <button class="answer" type="button"></button>
      </div>

      <div class="explain hidden" id="explain">
        <div class="explain-title" id="explainTitle"></div>
        <div class="explain-sum" id="explainSum"></div>
        <div class="explain-steps" id="explainSteps"></div>
        <div class="dots" id="dots"></div>
        <button id="nextBtn" class="big-btn" type="button">Понятно, дальше ➜</button>
      </div>
    </section>

    <!-- ===== Итоги ===== -->
    <section id="result" class="screen">
      <div class="card result-card">
        <div class="result-stars" id="resStars"></div>
        <h2 id="resTitle"></h2>
        <p class="res-text" id="resText"></p>
        <div class="res-stats" id="resStats"></div>
        <div class="banner record hidden" id="resRecord">🎉 Новый рекорд!</div>
        <div class="banner levelup hidden" id="resLevel"></div>
        <div class="mistakes hidden" id="resMistakes"></div>
      </div>
      <button id="againBtn" class="big-btn" type="button">Ещё раз 🔁</button>
      <button id="menuBtn" class="big-btn secondary" type="button">В меню</button>
    </section>

  </main>
  <script src="game.js"></script>
</body>
</html>
